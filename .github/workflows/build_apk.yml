name: Flutter Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      # هذه الخطوة تبحث عن ملفات المشروع في أي مكان وتنشئ ملفات الأندرويد المفقودة
      - name: Create Android directory and Get Dependencies
        run: |
          find . -name "pubspec.yaml" -exec dirname {} \; | xargs -I {} sh -c 'cd {} && flutter create . && flutter pub get'

      # هذه الخطوة تقوم بالبناء في المجلد الذي يوجد فيه المشروع
      - name: Build APK
        run: |
          find . -name "pubspec.yaml" -exec dirname {} \; | xargs -I {} sh -c 'cd {} && flutter build apk --release'

      # رفع الملف الناتج
- uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
