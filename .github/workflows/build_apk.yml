name: 🚀 Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # السماح بالتشغيل اليدوي من واجهة GitHub

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK 17 (Required for Android build)
      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter SDK (Stable channel)
      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      # 4. Verify Flutter installation
      - name: ✅ Verify Flutter
        run: flutter --version

      # 5. Get Flutter dependencies
      - name: 📦 Get Dependencies
        run: flutter pub get

      # 6. Run Flutter analyzer for code quality check
      - name: 🔍 Analyze Code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 7. Build APK (Release mode, optimized & signed with debug key)
      - name: 🔨 Build Release APK
        run: flutter build apk --release --no-shrink

      # 8. Upload APK as a downloadable artifact
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wafeer-financial-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 9. Show APK size info
      - name: 📊 APK Build Summary
        run: |
          echo "✅ APK built successfully!"
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo "📱 APK is ready to download from the Artifacts section above."
